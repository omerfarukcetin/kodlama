<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fare Macerası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
 --bg1:#d9f7d6;--bg2:#8fd99a;--ink:#1f2340;--muted:#6b7090;--accent:#ff7a59;--title:#1f4d2a;--wall:linear-gradient(135deg,#2e7d32,#81c784);
 --card:#ffffff;--line:#e6e8f2;--soft:#f4f6fb;--r:22px;
 --sh1:0 1px 2px rgba(20,25,60,.06),0 6px 18px rgba(20,25,60,.10);
 --sh2:0 2px 4px rgba(20,25,60,.08),0 14px 34px rgba(20,25,60,.16);
 --fh:"Baloo 2","Nunito","Segoe UI",system-ui,sans-serif;
 --fb:"Nunito","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--fb);font-weight:800;color:var(--ink);user-select:none;-webkit-user-select:none}
body{background:radial-gradient(1200px 600px at 15% -10%,rgba(255,255,255,.55),transparent 60%),linear-gradient(160deg,var(--bg1),var(--bg2))}
button{font-family:inherit;font-weight:800}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center}
.screen.on{display:flex}
.btn{border:0;border-radius:16px;padding:12px 22px;font-size:20px;background:#fff;color:var(--ink);cursor:pointer;box-shadow:var(--sh1);transition:transform .12s,box-shadow .12s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.btn:active{transform:translateY(1px)}
.btn.go{background:linear-gradient(180deg,#5fd068,#3aa847);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.iconbtn{width:58px;height:58px;border-radius:18px;border:0;background:#fff;box-shadow:var(--sh1);font-size:28px;cursor:pointer;flex:none;transition:transform .12s}
.iconbtn:hover{transform:translateY(-2px)}
.voice{position:fixed;right:18px;top:16px;z-index:50}

/* ---------- home ---------- */
.hero{display:flex;align-items:center;gap:26px;margin:46px 16px 8px}
.hero-mouse{width:96px;height:140px;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 10px 14px rgba(0,0,0,.18))}
.big-title{font-family:var(--fh);font-size:76px;line-height:.95;margin:0;color:var(--title);letter-spacing:-.5px}
.sub{font-size:22px;margin:6px 0 0;color:var(--title);opacity:.8}
.theme-grid{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;padding:28px 16px}
.tcard{width:220px;border-radius:28px;background:#fff;padding:18px 18px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;cursor:pointer;box-shadow:var(--sh2);transition:transform .18s}
.tcard:hover{transform:translateY(-8px) rotate(-1.5deg)}
.tcard .tc-art{width:100%;height:150px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:96px;position:relative;overflow:hidden}
.tcard .tc-art .tc-small{position:absolute;font-size:30px;opacity:.85}
.tcard .tc-name{font-family:var(--fh);font-size:30px;line-height:1}
.tcard .tc-go{font-size:15px;color:#fff;background:var(--ink);border-radius:999px;padding:6px 16px}

/* ---------- menu ---------- */
.menu-head{display:flex;align-items:center;gap:16px;width:100%;max-width:1240px;padding:18px 20px 4px}
.mtitle{flex:1;margin:0;font-family:var(--fh);font-size:44px;color:var(--title);text-align:center;line-height:1}
.total{font-size:22px;background:#fff;border-radius:16px;padding:12px 18px;box-shadow:var(--sh1);margin-right:150px}
.level-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;width:100%;max-width:1240px;padding:16px 20px;overflow:auto}
.lcard{background:#fff;border-radius:24px;padding:16px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;box-shadow:var(--sh1);transition:transform .15s,box-shadow .15s;position:relative;border:3px solid transparent}
.lcard:hover{transform:translateY(-5px);box-shadow:var(--sh2);border-color:var(--accent)}
.lcard .num{position:absolute;top:10px;left:10px;font-size:17px;background:var(--accent);color:#fff;border-radius:12px;min-width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.lcard .lmouse{position:absolute;top:8px;right:10px;width:30px;height:44px}
.lcard .li{width:92px;height:92px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:54px;margin-top:6px}
.lcard .ln{font-size:16px;text-align:center;min-height:42px;display:flex;align-items:center;color:var(--ink);line-height:1.2}
.lcard .ls{font-size:22px;letter-spacing:2px}
.lcard .ls .off{filter:grayscale(1);opacity:.25}
.note{font-size:14px;color:var(--title);max-width:1100px;text-align:center;margin:4px 16px 14px;opacity:.75}

/* ---------- play HUD ---------- */
.hud{width:100%;display:flex;align-items:stretch;gap:12px;padding:12px 14px 0}
.hud-left{display:flex;flex-direction:column;gap:8px;align-items:center}
.lvl-chip{width:58px;border-radius:18px;background:#fff;box-shadow:var(--sh1);display:flex;flex-direction:column;align-items:center;padding:4px 0;font-size:15px}
.lvl-chip b{font-size:30px;line-height:1.1}
.guide{flex:1;display:flex;align-items:center;gap:14px;background:#fff;border-radius:26px;padding:10px 14px;box-shadow:var(--sh1);min-width:0}
.masc{font-size:56px;flex:none;line-height:1}
.masc.shake{animation:shake .4s}
.guide-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.pics{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pics.pop{animation:popin .45s}
.pic{height:70px;min-width:70px;padding:0 6px;border-radius:18px;background:var(--soft);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:46px;line-height:1}
.pic.mouse{background:#fff4ef;border-color:#ffd2c2}
.pic.mouse svg{height:60px;width:42px}
.pic.num{font-size:36px;width:70px;border-radius:50%;background:#fff;border:5px solid #ff7043;color:#ff7043}
.pic.arrow{background:none;border:0;min-width:0;font-size:40px;color:var(--accent);padding:0}
.pic.sep{background:none;border:0;min-width:0;width:3px;height:56px;padding:0;margin:0 6px;background:var(--line);border-radius:3px}
.pic.wbtn{width:76px;height:54px;border-radius:10px;background:linear-gradient(#4f8ff7,#2f6fdc);border:0;color:#fff;font-size:30px;font-weight:900}
.pic.wbtn.red{background:#e53935}
.pic.task{width:110px;height:54px;border-radius:10px;background:#1c2438;border:0;color:#fff;font-size:26px;border-bottom:5px solid #6cf}
.pic.no{position:relative}
.pic.no::after{content:"";position:absolute;inset:6px;border:5px solid #e53935;border-radius:50%;background:linear-gradient(45deg,transparent 46%,#e53935 46%,#e53935 54%,transparent 54%)}
.cap{font-size:21px;color:var(--ink);line-height:1.2}
.gbtns{display:flex;flex-direction:column;gap:8px;flex:none}
.showbtn{border:0;border-radius:18px;background:linear-gradient(180deg,#ffd54f,#ffb300);color:#4a3200;font-size:30px;padding:6px 14px;cursor:pointer;box-shadow:var(--sh1);display:flex;flex-direction:column;align-items:center;line-height:1;transition:transform .12s}
.showbtn span{font-size:14px;margin-top:2px}
.showbtn:hover{transform:translateY(-2px)}
.showbtn.small{font-size:22px;padding:6px 10px;background:#fff;color:var(--ink)}
.ring{width:84px;flex:none;background:#fff;border-radius:22px;box-shadow:var(--sh1);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px}
.ring svg{width:64px;height:64px}
.ring .rt{font-size:15px;margin-top:-2px}
#stageWrap{flex:1;width:100%;padding:12px 14px 14px;position:relative;min-height:0}
#stage{position:relative;width:100%;height:100%;border-radius:28px;overflow:hidden;background:rgba(255,255,255,.35);box-shadow:inset 0 0 0 3px rgba(255,255,255,.7),var(--sh1)}
#toast{position:absolute;top:28px;left:50%;transform:translateX(-50%) translateY(-20px);background:#fff;border-radius:20px;padding:10px 22px;font-size:24px;opacity:0;transition:.25s;pointer-events:none;z-index:900;white-space:nowrap;box-shadow:var(--sh2);display:flex;align-items:center;gap:12px;border:3px solid #ffb300}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast .ti{font-size:38px}

/* ---------- gösteren el ---------- */
.ghost{position:fixed;left:0;top:0;z-index:1500;pointer-events:none;display:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.ghost .gbadge{position:absolute;left:44px;top:50px;width:36px;height:52px;opacity:0;transition:opacity .15s}
.ghost .gbadge.on{opacity:1}
.ghost .gbadge svg{width:100%;height:100%}
.ghost .ghand{position:absolute;left:30px;top:28px;font-size:40px;opacity:0}
.ghost .ghand.on{opacity:1}
.ripple{position:fixed;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;border:7px solid #ff7043;pointer-events:none;z-index:1499}
.ripple.r{border-color:#1e88e5}
.gclone{position:fixed;left:0;top:0;font-size:64px;z-index:1498;pointer-events:none;opacity:.8}
.garrow{position:fixed;font-size:60px;z-index:1499;pointer-events:none}

/* ---------- genel ---------- */
.item{position:absolute;cursor:pointer;line-height:1;filter:drop-shadow(0 4px 3px rgba(0,0,0,.25));transition:scale .35s,opacity .35s}
.bob{animation:bob 2s ease-in-out infinite}
.gone{scale:1.9;opacity:0;pointer-events:none}
.wob{animation:shake .4s}
@keyframes bob{50%{transform:translateY(-14px)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-6deg)}40%{transform:translateX(10px) rotate(6deg)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
@keyframes pulse{50%{transform:scale(1.15)}}
@keyframes popin{0%{transform:scale(.85);opacity:.3}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
@keyframes hintpulse{50%{box-shadow:0 0 0 6px #ffeb3b inset,0 0 18px 6px #ffeb3b;background:rgba(255,235,59,.55)}}
.hint{animation:hintpulse 1s infinite!important}
.fstar{position:fixed;font-size:44px;pointer-events:none;z-index:1000}
.bubble{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.95),rgba(255,255,255,.35) 25%,rgba(150,210,255,.35) 70%,rgba(120,180,255,.6));box-shadow:inset 0 0 12px rgba(255,255,255,.8),0 4px 10px rgba(0,0,0,.15);transition:scale .25s,opacity .25s}
.bubble.popped{scale:1.6;opacity:0;pointer-events:none}
.dotsvg{position:absolute;inset:0}
.dot{position:absolute;width:64px;height:64px;border-radius:50%;background:#fff;border:5px solid #9aa0b8;display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer;z-index:2;box-shadow:var(--sh1)}
.dot.next{border-color:#ff7043;color:#ff7043;animation:pulse 1s infinite}
.dot.done{background:#4caf50;color:#fff;border-color:#2e7d32}
.cgrid{position:absolute;inset:0;display:flex;flex-wrap:wrap;gap:26px;align-content:center;justify-content:center;padding:20px}
.pcard{width:160px;height:170px;background:#fff;border-radius:24px;border:4px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:76px;cursor:context-menu;position:relative;box-shadow:var(--sh1);transition:background .3s}
.pcard .ctag{position:absolute;top:-16px;right:-16px;width:56px;height:56px;border-radius:50%;border:5px solid #fff;box-shadow:var(--sh1)}
.pcard.painted .ctag{display:none}
.cmenu{position:absolute;background:#fff;border-radius:12px;box-shadow:var(--sh2);padding:6px;z-index:60;display:none;border:1px solid #d7dae6}
.cmenu.on{display:block}
.cmenu .mi{display:flex;align-items:center;gap:12px;padding:8px 12px;font-size:20px;border-radius:8px;cursor:pointer}
.cmenu .mi:hover{background:#e3f2fd}
.cmenu .sw{width:44px;height:44px;border-radius:50%;border:3px solid rgba(0,0,0,.2)}
.cmenu hr{border:0;border-top:1px solid #e3e5ee;margin:4px 0}
.lr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:40px;cursor:pointer}
.lr-side{font-size:96px;text-align:center;width:190px;padding:20px;border-radius:30px;background:rgba(255,255,255,.5);transition:.2s;opacity:.3}
.lr-side.on{opacity:1;background:#fff;transform:scale(1.12);box-shadow:var(--sh2)}
.lr-mouse{width:220px;height:330px}
.lr-mouse svg{width:100%;height:100%}
.gbox{width:130px;height:130px;font-size:90px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.8);border-radius:26px;cursor:pointer;box-shadow:var(--sh1)}
.gbox.opened{background:#fff9c4;animation:pulse .5s}
.scroller{position:absolute;inset:0;overflow-y:scroll}
.scroller::-webkit-scrollbar{width:24px}
.scroller::-webkit-scrollbar-thumb{background:#fff;border-radius:12px;border:4px solid rgba(0,0,0,.2)}
.scroll-inner{position:relative;height:3400px}
.deco{position:absolute;opacity:.45;font-size:44px;pointer-events:none}
.findme{position:absolute;font-size:84px;cursor:pointer;animation:bob 1.6s infinite;filter:drop-shadow(0 0 10px #fff)}
.flag{position:absolute;top:30px;left:50%;margin-left:-60px;width:120px;text-align:center;font-size:90px;cursor:pointer;opacity:.35}
.flag.on{opacity:1;animation:pulse 1s infinite}
.arrowhint{position:absolute;left:50%;bottom:20px;margin-left:-45px;font-size:90px;pointer-events:none;animation:bob 1s infinite;z-index:5}
.depth{position:absolute;left:14px;top:14px;background:#fff;border-radius:16px;padding:6px 16px;font-size:30px;z-index:5;pointer-events:none;box-shadow:var(--sh1)}
.sitem{position:absolute;width:110px;height:110px;font-size:80px;display:flex;align-items:center;justify-content:center;cursor:grab;background:rgba(255,255,255,.85);border-radius:24px;box-shadow:var(--sh1);touch-action:none}
.dragging{z-index:999!important;cursor:grabbing;opacity:.92}
.zone{position:absolute;bottom:20px;width:38%;height:42%;border-radius:30px;background:rgba(255,255,255,.85);border:6px dashed #9aa0b8;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:.15s}
.zone .zb{font-size:90px;line-height:1}
.zone .zl{font-size:22px;color:var(--muted)}
.zone .zin{font-size:34px;min-height:40px}
.zone.hot,.dicon.hot{background:#fff59d!important;border-color:#fbc02d;transform:scale(1.05)}
.desk{position:absolute;inset:0;background:var(--wall);display:flex;flex-direction:column}
.desk-area{position:relative;flex:1;overflow:hidden}
.desk-wm{position:absolute;right:6%;bottom:8%;font-size:180px;opacity:.18;pointer-events:none}
.taskbar{height:58px;background:rgba(20,30,50,.88);display:flex;align-items:center;gap:8px;padding:0 10px;color:#fff;flex:none}
.startbtn{font-size:30px;padding:0 8px}
.tasks{display:flex;gap:6px;flex:1}
.taskbtn{height:46px;padding:0 16px;border-radius:8px;background:rgba(255,255,255,.18);display:flex;align-items:center;gap:6px;font-size:18px;cursor:pointer;border-bottom:4px solid #6cf}
.taskbtn:hover{background:rgba(255,255,255,.3)}
.taskbtn.off{border-bottom-color:transparent;opacity:.85}
.clock{font-size:18px;padding:0 8px}
.dicon{position:absolute;width:108px;padding:6px 4px;border-radius:10px;text-align:center;color:#fff;cursor:pointer;z-index:1;touch-action:none}
.dicon:hover{background:rgba(255,255,255,.2)}
.dicon.sel{background:rgba(255,255,255,.35)}
.dimg{font-size:56px;line-height:1.1;position:relative;display:inline-block}
.dlbl{font-size:15px;text-shadow:0 1px 3px #000,0 0 2px #000;line-height:1.15}
.badge{position:absolute;top:-6px;right:-16px;background:#e53935;color:#fff;border-radius:12px;font-size:15px;padding:1px 8px}
.win{position:absolute;background:#fff;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.4);display:flex;flex-direction:column;overflow:hidden;z-index:10;transition:left .25s,top .25s,width .25s,height .25s,opacity .25s,transform .25s;animation:winopen .25s}
@keyframes winopen{from{transform:scale(.6);opacity:0}}
.win.dragging-win{transition:none;opacity:.92}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}
.win.minz{opacity:0;transform:translateY(70%) scale(.15);pointer-events:none}
.win.closing{opacity:0;transform:scale(.8)}
.wtitle{height:50px;background:linear-gradient(#4f8ff7,#2f6fdc);color:#fff;display:flex;align-items:center;padding-left:12px;gap:8px;font-size:19px;cursor:grab;flex:none;touch-action:none}
.wt{flex:1;white-space:nowrap;overflow:hidden}
.wb{width:58px;height:50px;border:0;background:transparent;color:#fff;font-size:24px;cursor:pointer;font-weight:900}
.wb:hover{background:rgba(255,255,255,.3)}
.sq{display:inline-block;width:18px;height:18px;border:3px solid #fff;border-radius:2px;vertical-align:middle}
.sq2{display:inline-block;width:15px;height:15px;border:3px solid #fff;border-radius:2px;position:relative;margin:6px 0 0 -4px;vertical-align:middle}
.sq2::after{content:"";position:absolute;left:3px;top:-9px;width:15px;height:15px;border-top:3px solid #fff;border-right:3px solid #fff}
.pic.wbtn .sq{width:24px;height:24px}
.wb.close:hover{background:#e53935}
.wbody{flex:1;padding:16px;overflow:auto;display:flex;flex-wrap:wrap;gap:14px;align-content:flex-start;font-size:54px;transition:background .15s}
.wbody.hot{background:#fff59d}
.wbody .empty{font-size:20px;opacity:.6;width:100%}
.tzone{position:absolute;border:6px dashed #ffeb3b;border-radius:24px;background:rgba(255,235,59,.25);display:none;align-items:center;justify-content:center;font-size:90px;z-index:0;pointer-events:none}
.tzone.show{display:flex}
.empbtn{font-size:22px;margin-top:10px}
.paintwrap{position:absolute;inset:0;display:flex;gap:10px;padding:10px}
.paintwrap svg{flex:1;height:100%;background:#fff;border-radius:18px}
.paintwrap svg .rg{cursor:pointer;stroke:#333;stroke-width:4;transition:fill .2s}
.pthumb{width:250px;height:170px;background:#fff;border-radius:22px;padding:8px;cursor:pointer;box-shadow:var(--sh1);transition:transform .15s,box-shadow .15s;border:4px solid transparent}
.pthumb:hover{transform:translateY(-6px) rotate(-1deg);box-shadow:var(--sh2);border-color:var(--accent)}
.pthumb svg{width:100%;height:100%;display:block}
.palette{width:150px;display:flex;flex-direction:column;gap:10px;align-items:center;overflow:auto;background:rgba(255,255,255,.9);border-radius:18px;padding:12px}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pc{width:52px;height:52px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px #c5c8d6;cursor:pointer}
.pc.sel{box-shadow:0 0 0 5px var(--ink);transform:scale(1.1)}
.ptip{display:flex;align-items:center;gap:6px;font-size:26px}
.ptip svg{width:28px;height:40px}
.overlay{position:fixed;inset:0;background:rgba(20,25,60,.45);display:none;align-items:center;justify-content:center;z-index:2000;backdrop-filter:blur(3px)}
.overlay.on{display:flex}
.cele-box{background:#fff;border-radius:36px;padding:30px 44px;text-align:center;animation:winopen .35s;max-width:92vw;box-shadow:var(--sh2)}
.cele-m{font-size:100px;line-height:1.1}
.cele-box h2{font-family:var(--fh);font-size:58px;margin:0;line-height:1.1}
.stars{font-size:64px;margin:10px 0 22px;letter-spacing:6px}
.stars .off{filter:grayscale(1);opacity:.25}
.crow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.crow .btn{font-size:26px;padding:14px 24px}
.conf{position:fixed;width:14px;height:20px;top:-30px;z-index:2001;pointer-events:none;border-radius:3px}
@media (max-width:760px){.big-title{font-size:46px}.hero-mouse{width:60px}.pic{height:52px;min-width:52px;font-size:32px}.masc{font-size:38px}.total{margin-right:0}}
</style>
</head>
<body>

<section id="home" class="screen on">
  <div class="hero">
    <div class="hero-mouse" id="heroMouse"></div>
    <div><h1 class="big-title">Fare Macerası</h1><p class="sub">Bir dünya seç 👇</p></div>
  </div>
  <div id="themeGrid" class="theme-grid"></div>
</section>

<section id="menu" class="screen">
  <div class="menu-head">
    <button class="btn" id="bTheme">🌍 Dünyalar</button>
    <h1 class="mtitle" id="mTitle"></h1>
    <div class="total" id="total"></div>
  </div>
  <div id="levelGrid" class="level-grid"></div>
  <p class="note">Öğretmen notu: 1→12 sırayla önerilir (~40 dk). Her bölümde 👀 düğmesi hareketi canlı gösterir, 🔊 yönergeyi sesli okur.</p>
</section>

<section id="play" class="screen">
  <div class="hud">
    <div class="hud-left">

/* ---------- ses ---------- */
let AC;
function tone(freqs,dur=.12,type='sine',vol=.15){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;freqs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t+i*dur);g.gain.exponentialRampToValueAtTime(.001,t+(i+1)*dur);o.connect(g).connect(AC.destination);o.start(t+i*dur);o.stop(t+(i+1)*dur+.02)})}catch(e){}}
const sfx={good:()=>tone([660,880],.09),bad:()=>tone([240,190],.13,'triangle',.12),pop:()=>tone([950],.06,'square',.05),win:()=>tone([523,659,784,1046,1318],.13)};
function speak(t){if(!save.voice||!t||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/\p{Extended_Pictographic}|️|‍|[⬜□❐—✖↕↔]/gu,' '));u.lang='tr-TR';const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith('tr'));if(v)u.voice=v;u.rate=.92;speechSynthesis.speak(u)}catch(e){}}
function setVoiceBtn(){$('#bVoice').textContent=save.voice?'🔊 Ses açık':'🔇 Ses kapalı'}
$('#bVoice').onclick=()=>{save.voice=!save.voice;if(!save.voice&&'speechSynthesis' in window)speechSynthesis.cancel();persist();setVoiceBtn()};

/* ---------- fare simgesi ---------- */
function mouseSVG(m){
 const A='#ff7043';
 const L=(m==='left'||m==='double'||m==='drag')?A:'#fff',R=m==='right'?A:'#fff',Wh=m==='wheel'?A:'#c3c6d4';
 const extra={double:'<text x="30" y="70" text-anchor="middle" font-size="22" font-weight="900" fill="#e53935" font-family="Nunito,sans-serif">x2</text>',drag:'<text x="30" y="72" text-anchor="middle" font-size="22">✊</text>',wheel:'<text x="30" y="72" text-anchor="middle" font-size="24" font-weight="900" fill="#e53935">↕</text>',move:'<text x="30" y="72" text-anchor="middle" font-size="24" font-weight="900" fill="#1e88e5">↔</text>'}[m]||'';
 return `<svg viewBox="0 0 60 90"><path d="M30 4C14 4 6 16 6 34V60C6 76 16 86 30 86C44 86 54 76 54 60V34C54 16 46 4 30 4Z" fill="#f7f8fc" stroke="#2b2f4a" stroke-width="3"/><path d="M30 4C14 4 6 16 6 34V38H30Z" fill="${L}" stroke="#2b2f4a" stroke-width="3"/><path d="M30 4C46 4 54 16 54 34V38H30Z" fill="${R}" stroke="#2b2f4a" stroke-width="3"/><rect x="25.5" y="13" width="9" height="17" rx="4.5" fill="${Wh}" stroke="#2b2f4a" stroke-width="2"/>${extra}</svg>`;
}
/* piktogram belirteçleri: M:mod (fare), > (ok), | (ayraç), N:sayı, B:max/min/restore/close/task, X:emoji (yasak), diğer = emoji */
function renderPics(list){
 return list.map(t=>{
  if(t==='>')return '<div class="pic arrow">➜</div>';
  if(t==='|')return '<div class="pic sep"></div>';
  if(t.startsWith('M:'))return `<div class="pic mouse">${mouseSVG(t.slice(2))}</div>`;
  if(t.startsWith('N:'))return `<div class="pic num">${t.slice(2)}</div>`;
  if(t.startsWith('X:'))return `<div class="pic no">${t.slice(2)}</div>`;
  if(t.startsWith('B:')){const k=t.slice(2);if(k==='task')return '<div class="pic task">📁</div>';return `<div class="pic wbtn${k==='close'?' red':''}">${{max:'<i class="sq"></i>',restore:'<i class="sq2"></i>',min:'—',close:'✖'}[k]}</div>`}
  return `<div class="pic">${t}</div>`;
 }).join('');
}

/* ---------- gösteren el (demo) ---------- */
const ghost=$('#ghost'),gbadge=$('#gbadge'),ghand=$('#ghand');let gx=0,gy=0,demoTok=0,demoBusy=false;
function ctr(el){const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]}
function gPlace(x,y){gx=x;gy=y;ghost.style.transform=`translate(${x-5}px,${y-3}px)`}
async function gMove(x,y,dur,tok){const a=ghost.animate([{transform:`translate(${gx-5}px,${gy-3}px)`},{transform:`translate(${x-5}px,${y-3}px)`}],{duration:dur,easing:'ease-in-out',fill:'forwards'});await sleep(dur);a.cancel();if(tok===demoTok)gPlace(x,y)}
function ripple(x,y,right){const r=mk('div','ripple'+(right?' r':''),document.body);r.style.left=x+'px';r.style.top=y+'px';r.animate([{transform:'scale(.2)',opacity:1},{transform:'scale(1.6)',opacity:0}],{duration:550,easing:'ease-out'}).onfinish=()=>r.remove()}
const resolve=e=>typeof e==='function'?e():e;
async function runDemo(actions){
 const tok=++demoTok;demoBusy=true;const sr=stage.getBoundingClientRect();
 gPlace(sr.left+sr.width/2,sr.bottom-30);ghost.style.display='block';ghost.style.opacity=1;
 try{
 for(const a of actions){
  if(tok!==demoTok)return;
  const el=resolve(a.el);if(a.el&&(!el||!el.isConnected))continue;
  if(a.t==='move'){const[x,y]=ctr(el);await gMove(x,y,900,tok);await sleep(400)}
  else if(a.t==='click'||a.t==='dbl'){const[x,y]=a.at?a.at(el):ctr(el);await gMove(x,y,850,tok);if(tok!==demoTok)return;gbadge.innerHTML=mouseSVG(a.t==='dbl'?'double':(a.b||'left'));gbadge.classList.add('on');await sleep(250);ripple(x,y,a.b==='right');tone([a.b==='right'?520:760],.05,'sine',.06);if(a.t==='dbl'){await sleep(180);ripple(x,y);tone([760],.05,'sine',.06)}await sleep(650);gbadge.classList.remove('on')}
  else if(a.t==='drag'){const to=resolve(a.to);if(!to||!to.isConnected)continue;const[x,y]=ctr(el),[tx,ty]=a.toPt?a.toPt(to):ctr(to);await gMove(x,y,850,tok);if(tok!==demoTok)return;gbadge.innerHTML=mouseSVG('drag');gbadge.classList.add('on');ghand.classList.add('on');ripple(x,y);await sleep(350);
   const cl=mk('div','gclone',document.body,a.label||el.textContent.trim().slice(0,2));const ca=cl.animate([{transform:`translate(${x-32}px,${y-40}px)`},{transform:`translate(${tx-32}px,${ty-40}px)`}],{duration:1300,easing:'ease-in-out',fill:'forwards'});
   await gMove(tx,ty,1300,tok);await sleep(250);ca.cancel();cl.remove();ghand.classList.remove('on');gbadge.classList.remove('on');await sleep(300)}
  else if(a.t==='wheel'){const sr2=stage.getBoundingClientRect();const x=sr2.left+sr2.width/2,y=sr2.top+sr2.height/2;await gMove(x,y,800,tok);gbadge.innerHTML=mouseSVG('wheel');gbadge.classList.add('on');
   for(let k=0;k<3&&tok===demoTok;k++){const ar=mk('div','garrow',document.body,a.dir==='up'?'⬆️':'⬇️');ar.style.left=(x+70)+'px';ar.style.top=(y-30)+'px';ar.animate([{transform:'translateY(0)',opacity:1},{transform:`translateY(${a.dir==='up'?-90:90}px)`,opacity:0}],{duration:600}).onfinish=()=>ar.remove();await sleep(650)}gbadge.classList.remove('on')}
 }
 await sleep(300);
 }finally{if(tok===demoTok){ghost.animate([{opacity:1},{opacity:0}],{duration:300}).onfinish=()=>{if(tok===demoTok)ghost.style.display='none'};demoBusy=false}}
}
function stopDemo(){demoTok++;demoBusy=false;ghost.style.display='none';gbadge.classList.remove('on');ghand.classList.remove('on');document.querySelectorAll('.gclone,.garrow,.ripple').forEach(e=>e.remove())}

/* ---------- ekranlar ---------- */
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));$('#bVoice').style.display=id==='play'?'none':''}
function applyTheme(k){theme=THEMES[k];save.theme=k;persist();const r=document.documentElement.style;r.setProperty('--bg1',theme.bg1);r.setProperty('--bg2',theme.bg2);r.setProperty('--title',theme.title);r.setProperty('--accent',theme.accent);r.setProperty('--wall',theme.wall)}
function renderHome(){$('#heroMouse').innerHTML=mouseSVG('left');const g=$('#themeGrid');g.innerHTML='';
 for(const k in THEMES){const t=THEMES[k];const c=mk('div','tcard',g,`<div class="tc-art" style="background:${t.art}">${t.icon}<span class="tc-small" style="left:12px;top:10px">${t.items[0]}</span><span class="tc-small" style="right:14px;bottom:10px">${t.items[2]}</span><span class="tc-small" style="right:16px;top:14px">${t.mascot}</span></div><div class="tc-name">${t.name}</div><div class="tc-go">Başla ▶</div>`);
  c.onclick=()=>{applyTheme(k);sfx.good();speak(t.name+' dünyasına hoş geldin!');renderMenu();show('menu')}}}
function starHTML(n){let s='';for(let i=0;i<3;i++)s+=i<n?'⭐':'<span class="off">⭐</span>';return s}
function renderMenu(){$('#mTitle').textContent=theme.icon+' '+theme.name;const g=$('#levelGrid');g.innerHTML='';let tot=0;
 LEVELS.forEach((L,i)=>{const s=save.stars[i]||0;tot+=s;const c=mk('div','lcard',g,`<div class="num">${i+1}</div><div class="lmouse">${mouseSVG(L.mode)}</div><div class="li">${L.icon}</div><div class="ln">${L.title}</div><div class="ls">${starHTML(s)}</div>`);c.onclick=()=>startLevel(i)});
 $('#total').textContent=`⭐ ${tot} / ${LEVELS.length*3}`+(tot===LEVELS.length*3?' 🏆':'')}

/* ---------- bölüm motoru ---------- */
const stage=$('#stage');let cur=null,Z=20;
function stopLevel(){stopDemo();if(cur){cur.cl.forEach(f=>{try{f()}catch(e){}});cur=null}if('speechSynthesis' in window)speechSynthesis.cancel();stage.innerHTML=''}
let toastT;
function toast(t,icon='💡'){const el=$('#toast');el.innerHTML=`<span class="ti">${icon}</span>${t}`;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2400)}
function floatStar(el){const r=el.getBoundingClientRect();const s=mk('div','fstar',document.body,'⭐');s.style.left=(r.left+r.width/2-22)+'px';s.style.top=(r.top)+'px';s.animate([{transform:'translateY(0) scale(.6)',opacity:1},{transform:'translateY(-90px) scale(1.3)',opacity:0}],{duration:800,easing:'ease-out'}).onfinish=()=>s.remove()}
function startLevel(i){
 stopLevel();$('#cele').classList.remove('on');show('play');
 const L=LEVELS[i];$('#lnum').textContent=i+1;$('#licon').textContent=L.icon;$('#masc').textContent=theme.mascot;
 const st={i,cl:[],err:0,done:false,demo:null,last:Date.now(),badRun:0,said:''};cur=st;
 const c={stage,
  guide(o){st.demo=o.demo||null;st.said=o.speak||o.text||'';const p=$('#pics');p.innerHTML=renderPics(o.pics||[]);p.classList.remove('pop');void p.offsetWidth;p.classList.add('pop');$('#instr').textContent=o.text||'';$('#bShow').style.visibility=st.demo?'visible':'hidden';speak(st.said);st.last=Date.now();st.badRun=0;
   if(st.demo&&o.auto!==false){stopDemo();c.later(()=>c.showMe(),o.delay||1100)}},
  showMe(){if(st.demo&&!st.done){const acts=st.demo();if(acts&&acts.length)runDemo(acts)}},
  progress(n,t){$('#ringFill').style.strokeDashoffset=163.4*(1-n/t);$('#ptext').textContent=n+' / '+t},
  good(el){sfx.good();st.badRun=0;st.last=Date.now();if(el)floatStar(el)},
  bad(msg,icon){st.err++;st.badRun++;sfx.bad();const m=$('#masc');m.classList.remove('shake');void m.offsetWidth;m.classList.add('shake');if(msg){toast(msg,icon||'🤔');speak(msg)}if(st.badRun>=2&&!demoBusy){st.badRun=0;c.later(()=>c.showMe(),900)}},
  later(fn,ms){const id=setTimeout(()=>{if(cur===st)fn()},ms);st.cl.push(()=>clearTimeout(id))},
  every(fn,ms){const id=setInterval(()=>{if(cur===st)fn()},ms);st.cl.push(()=>clearInterval(id))},
  listen(t,ev,fn,o){t.addEventListener(ev,fn,o);st.cl.push(()=>t.removeEventListener(ev,fn,o))},
  finish(){if(st.done)return;st.done=true;stopDemo();setTimeout(()=>{if(cur===st)celebrate(st)},800)},
  alive(){return cur===st&&!st.done}
 };
 /* hareketsiz kalınca el yeniden gösterir */
 c.listen(stage,'pointerdown',()=>{st.last=Date.now();if(demoBusy)stopDemo()});
 c.listen(stage,'wheel',()=>{st.last=Date.now()},{passive:true});
 c.every(()=>{if(!st.done&&st.demo&&!demoBusy&&Date.now()-st.last>13000){st.last=Date.now();c.showMe()}},1000);
 c.progress(0,1);$('#pics').innerHTML='';$('#instr').textContent='';
 setTimeout(()=>{if(cur===st)L.run(c)},40);
}
$('#bHome').onclick=()=>{stopLevel();renderMenu();show('menu')};
$('#bSpeak').onclick=()=>{if(cur)speak(cur.said)};
$('#bShow').onclick=()=>{if(cur){stopDemo();const c0=cur;setTimeout(()=>{if(cur===c0&&c0.demo){const a=c0.demo();a&&a.length&&runDemo(a)}},50)}};
function celebrate(st){
 const stars=st.err<=2?3:st.err<=6?2:1;save.stars[st.i]=Math.max(save.stars[st.i]||0,stars);persist();
 sfx.win();$('#celeM').textContent=pick(['🎉','🏆','🥳','🌟'])+theme.mascot;const w=pick(['Harika!','Süpersin!','Muhteşem!','Aferin!','Bravo!']);$('#celeT').textContent=w;$('#celeS').innerHTML=starHTML(stars);
 $('#bNext').style.display=st.i<LEVELS.length-1?'':'none';$('#cele').classList.add('on');speak(w+(st.i<LEVELS.length-1?'':' Bütün bölümleri bitirdin! Sen bir fare ustasısın!'));
 const cols=['#f44336','#ffeb3b','#4caf50','#2196f3','#9c27b0','#ff9800','#e91e63'];
 for(let k=0;k<70;k++){const p=mk('div','conf',document.body);p.style.left=rand(0,100)+'vw';p.style.background=pick(cols);p.animate([{transform:`translateY(0) rotate(0)`},{transform:`translate(${rand(-120,120)}px,110vh) rotate(${rand(360,1080)}deg)`}],{duration:rand(1800,3200),delay:rand(0,600),easing:'ease-in'}).onfinish=()=>p.remove()}
}

/* ---------- sürükle-bırak ---------- */
function draggable(el,{zones,onDrop,free}){
 el.addEventListener('pointerdown',e=>{

 let r=0,s=0,win=null,folder=null,zone=null,done=0,hintT=null;c.progress(0,TOT);
 function hintEl(k){if(k==='open')return folder;if(!win)return null;return{max:win.btnMax,restore:win.btnMax,min:win.btnMin,taskrestore:win.task,move:win.title,close:win.btnClose}[k]}

 function step(){const k=STEPS[s],R=rounds[r];zone.classList.toggle('show',k==='move');

function lvlPaint(c){
 const COLS=['#f44336','#ff9800','#ffeb3b','#4caf50','#2196f3','#9c27b0','#f06292','#795548','#90caf9','#212121'];
 let col=COLS[4];const NEED=8;const memo={};let best=0;c.progress(0,NEED);
 function picker(){
  c.stage.innerHTML='';const g=mk('div','cgrid',c.stage);
  PAINTS.forEach((p,i)=>{const card=mk('div','pthumb',g,`<svg viewBox="0 0 800 500">${p.svg()}</svg>`);
   card.querySelectorAll('.rg').forEach((r,k)=>{r.setAttribute('fill',(memo[i]&&memo[i][k])||'#fff');r.setAttribute('stroke','#333');r.setAttribute('stroke-width','6');r.removeAttribute('class')});
   card.onclick=()=>paint(i)});
  c.guide({pics:['M:left','🖼️','>','🖍️'],text:'Bir resim seç!',speak:'Hangi resmi boyamak istersin? Resme tıkla!',demo:()=>[{t:'click',el:g.children[0]}]});
 }
 function paint(idx){
 c.stage.innerHTML='';
 const P=PAINTS[idx];
 const wrap=mk('div','paintwrap',c.stage);
 wrap.innerHTML=`<svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet">${P.svg()}${idx===0?`<text x="470" y="370" font-size="64" text-anchor="middle" style="pointer-events:none">${theme.mascot}</text>`:''}</svg>`;
 const regs=[...wrap.querySelectorAll('.rg')];memo[idx]=memo[idx]||regs.map(()=>'#fff');const fills=memo[idx];
 const painted=new Set();regs.forEach((r,k)=>{r.setAttribute('fill',fills[k]);if(fills[k]!=='#fff')painted.add(r)});
 const pal=mk('div','palette',wrap,`<div class="pal"></div><div class="ptip">${mouseSVG('left')}🖌️</div><div class="ptip">${mouseSVG('right')}🧽</div>`);
 const pg=pal.querySelector('.pal');COLS.forEach(cc=>{const p=mk('div','pc'+(cc===col?' sel':''),pg);p.style.background=cc;p.onclick=()=>{col=cc;pg.querySelectorAll('.pc').forEach(x=>x.classList.remove('sel'));p.classList.add('sel');sfx.pop()}});
 const back=mk('button','btn',pal,'🖼️ ↩');back.style.fontSize='26px';back.title='Başka resim';back.onclick=()=>{sfx.pop();picker()};
 const doneBtn=mk('button','btn go',pal,'✔');doneBtn.style.fontSize='34px';
 const upd=()=>{best=Math.max(best,painted.size);c.progress(Math.min(best,NEED),NEED);doneBtn.disabled=best<NEED};upd();
 doneBtn.onclick=()=>{if(best>=NEED){c.good(doneBtn);c.finish()}};
 c.guide({pics:['M:left','🎨','>','🖼️','|','M:right','🧽'],text:'Renk seç, boya!',speak:'Sağdan bir renge sol tuşla tıkla. Sonra resimde bir yere tıkla, boya! Yanlış olursa sağ tuş siler.',
  demo:()=>{const unp=regs.filter(r=>!painted.has(r));const target=unp.find(r=>r.id===P.main)||unp[0];return[{t:'click',el:pg.children[0]},target?{t:'click',el:target}:null].filter(Boolean)}});
 regs.forEach((r,k)=>r.addEventListener('mousedown',e=>{if(!c.alive())return;if(e.button===0){r.setAttribute('fill',col);fills[k]=col;painted.add(r);sfx.pop()}else if(e.button===2){r.setAttribute('fill','#fff');fills[k]='#fff';painted.delete(r);tone([400],.06,'sine',.08)}
  upd();if(best>=NEED&&!wrap._said){wrap._said=1;c.guide({pics:['🖍️','>','M:left','✔','|','🖼️','↩'],text:'Bitince ✔ — başka resim 🖼️',speak:'Çok güzel! İstersen devam et ya da başka resim seç. Bitince yeşil tike tıkla.',demo:()=>[{t:'click',el:doneBtn}],auto:false})}}));
 }
 picker();
}
